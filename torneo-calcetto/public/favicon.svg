<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Torneo Calcetto">
  <title>Torneo Calcetto</title>
  <defs>
    <!-- stesso materiale dello sfondo dell'app: luce dall'alto sul campo notturno -->
    <radialGradient id="pitch" cx="50%" cy="-10%" r="120%">
      <stop offset="0%" stop-color="#1f7a44" />
      <stop offset="38%" stop-color="#14432a" />
      <stop offset="72%" stop-color="#0d3320" />
      <stop offset="100%" stop-color="#061c11" />
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2c877" />
      <stop offset="55%" stop-color="#e0ac48" />
      <stop offset="100%" stop-color="#a9720f" />
    </linearGradient>
    <linearGradient id="leather" x1="0.25" y1="0" x2="0.75" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f3f6ee" />
      <stop offset="100%" stop-color="#d8dece" />
    </linearGradient>
    <!-- volume del pallone: luce in alto a sinistra, ombra sul lembo opposto -->
    <radialGradient id="shine" cx="32%" cy="26%" r="72%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="shade" cx="76%" cy="82%" r="66%">
      <stop offset="0%" stop-color="#061c11" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#061c11" stop-opacity="0" />
    </radialGradient>
    <clipPath id="ballClip">
      <circle cx="256" cy="256" r="126" />
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#pitch)" />

  <!-- frammento di campo: linea di metà campo e cerchio di centro a gesso -->
  <g transform="rotate(-12 256 256)" fill="none" stroke="#f3f6ee" stroke-opacity="0.13" stroke-width="12">
    <path d="M-40 256H552" />
    <circle cx="256" cy="256" r="212" />
  </g>

  <!-- anello d'oro del torneo attorno al pallone del calcio d'inizio -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#ring)" stroke-width="15" />
  <circle cx="256" cy="256" r="176" fill="none" stroke="#061c11" stroke-opacity="0.35" stroke-width="2" />

  <g transform="rotate(-12 256 256)">
    <circle cx="256" cy="256" r="126" fill="url(#leather)" />
    <g clip-path="url(#ballClip)">
      <!-- macchie esagonali: una centrale, sei attorno tagliate dal bordo del pallone -->
      <path
        fill="#061c11"
        d="M256 210 295.8 233V279L256 302 216.2 279V233Z
           M368 212 406.1 234V278L368 300 329.9 278V234Z
           M312 309 350.1 331V375L312 397 273.9 375V331Z
           M200 309 238.1 331V375L200 397 161.9 375V331Z
           M144 212 182.1 234V278L144 300 105.9 278V234Z
           M200 115 238.1 137V181L200 203 161.9 181V137Z
           M312 115 350.1 137V181L312 203 273.9 181V137Z"
      />
      <circle cx="256" cy="256" r="126" fill="url(#shade)" />
      <circle cx="256" cy="256" r="126" fill="url(#shine)" />
    </g>
    <circle cx="256" cy="256" r="126" fill="none" stroke="#b9c0ad" stroke-width="3" />
  </g>

  <rect x="28" y="28" width="456" height="456" rx="84" fill="none" stroke="#e0ac48" stroke-opacity="0.45" stroke-width="6" />
</svg>
