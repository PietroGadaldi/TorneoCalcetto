      <stop offset="38%" stop-color="#1446d2" />
      <stop offset="72%" stop-color="#002db5" />
      <stop offset="100%" stop-color="#00113d" />
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2c877" />
